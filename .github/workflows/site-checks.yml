name: Site checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/check_site.py
      - run: python tools/check_records.py
      - run: node --test tests/privacy.test.cjs
      # Fonts differ by OS. Linux captures are uploaded for review; Windows
      # pixel comparisons run locally against the reviewed Windows baseline.
      - run: python tools/check_browser.py --screenshots-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-screenshots
          path: tests/artifacts
