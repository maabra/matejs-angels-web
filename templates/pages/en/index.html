<body>

  <!-- NAVBAR -->
  {{header}}

  <main class="page-content home-page" id="main-content">
    <section class="home-welcome section"><div class="container home-intro">
      <img class="hero-logo" src="../images/index/logo%20transparent2.png" alt="Matej's Angels" fetchpriority="high">
      <div class="home-intro-copy"><h1>{{title}}</h1><p>{{intro}}</p>
      <nav class="home-paths" aria-label="Explore the kennel"><a href="our-dogs"><span>{{dogs_action}}</span><span aria-hidden="true">→</span></a><a href="litters"><span>{{litters_action}}</span><span aria-hidden="true">→</span></a><a href="contact"><span>{{contact_action}}</span><span aria-hidden="true">→</span></a></nav></div>
      <figure class="home-pack"><img class="home-photo" src="../images/gallery/20260405_204945_preview_rev_2.png" alt="{{pack_alt}}" fetchpriority="high"></figure>
    </div></section>
    <section class="section section-ivory"><div class="container editorial-split"><div class="editorial-copy"><h2>{{story_title}}</h2><p>{{story_text}}</p><a class="section-link" href="about">{{story_action}} <span aria-hidden="true">→</span></a><a class="quiet-link" href="https://www.facebook.com/matejsangels/" target="_blank" rel="noopener noreferrer">{{facebook_action}}</a></div><div class="home-carousel" role="region" aria-roledescription="carousel" aria-label="Photographs of our dogs"><a class="home-carousel-slides" href="gallery" aria-label="Open gallery"><img src="../images/gallery/20250315_141136~2.jpg" alt="Photograph from the Matej’s Angels album" loading="lazy"><img src="../images/gallery/20250905_163548.jpg" alt="Photograph from the Matej’s Angels album" loading="lazy" hidden><img src="../images/gallery/20250908_204550.jpg" alt="Photograph from the Matej’s Angels album" loading="lazy" hidden></a><div class="home-carousel-controls"><button type="button" data-slide="-1" aria-label="Previous photograph">&larr;</button><span class="home-carousel-count" aria-live="off">1 / 3</span><button type="button" data-carousel-pause data-pause="Pause slideshow" data-play="Play slideshow" aria-label="Pause slideshow">&#8545;</button><button type="button" data-slide="1" aria-label="Next photograph">&rarr;</button></div></div></div></section>
    <section class="section"><div class="container editorial-split editorial-reverse"><div class="editorial-copy"><h2>{{album_title}}</h2><p>{{album_text}}</p><a class="section-link" href="gallery">{{gallery_action}} <span aria-hidden="true">→</span></a></div><div class="home-carousel" role="region" aria-roledescription="carousel" aria-label="Photographs of our dogs"><a class="home-carousel-slides" href="gallery" aria-label="Open gallery"><img src="../images/gallery/20260405_204948.jpg" alt="Photograph from the Matej’s Angels album" loading="lazy"><img src="../images/gallery/20260607_182428.jpg" alt="Photograph from the Matej’s Angels album" loading="lazy" hidden><img src="../images/gallery/Screenshot_20250320_220241_Photos.jpg" alt="Photograph from the Matej’s Angels album" loading="lazy" hidden></a><div class="home-carousel-controls"><button type="button" data-slide="-1" aria-label="Previous photograph">&larr;</button><span class="home-carousel-count" aria-live="off">1 / 3</span><button type="button" data-carousel-pause data-pause="Pause slideshow" data-play="Play slideshow" aria-label="Pause slideshow">&#8545;</button><button type="button" data-slide="1" aria-label="Next photograph">&rarr;</button></div></div></div></section>
