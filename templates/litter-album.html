<a class="litter-album" href="{{album_url}}">
  <div class="litter-album-photo"><img src="{{album_photo}}" alt="{{album_alt}}" loading="lazy"></div>
  <div class="litter-album-body">
    <h2>{{album_title}}</h2>
    <p class="litter-album-breed">{{album_breed}}</p>
    <div class="litter-album-meta"><p>{{album_date}}</p><span>{{album_count}}</span></div>
    <p class="litter-album-names">{{album_names}}</p>
    <span class="litter-album-action">{{album_action}}<span aria-hidden="true">→</span></span>
  </div>
</a>
